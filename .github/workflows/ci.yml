name: VS-01A checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/api/go.mod
      - name: Resolve Go modules
        run: go mod download
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vet development fixture build
        run: go vet -tags devfixture ./...
      - name: Standard tests
        run: go test ./...
      - name: Development API contract and security tests
        run: go test -tags devfixture ./...
      - name: Standard race tests
        run: go test -race ./...
      - name: Validate disposable fixture and race safety
        run: go test -race -tags devfixture ./...
      - name: Build
        run: go build ./...
      - name: Build development artifact
        run: go build -tags devfixture ./...
      - name: Verify fixture artifact exclusion and startup guards
        run: bash ../../scripts/check-fixture-boundary.sh

  identity-checkpoint-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: scripts/vs02a-jwt-checkpoint/go.sum
      - name: Resolve isolated checkpoint dependency
        working-directory: scripts/vs02a-jwt-checkpoint
        run: go mod download
      - name: Verify checkpoint formatting
        working-directory: scripts/vs02a-jwt-checkpoint
        run: test -z "$(gofmt -l .)"
      - name: Vet checkpoint
        working-directory: scripts/vs02a-jwt-checkpoint
        run: go vet ./...
      - name: Offline signature and negative tests with race detector
        working-directory: scripts/vs02a-jwt-checkpoint
        run: go test -count=1 -race -v ./...
      - name: Build operator-only verifier
        working-directory: scripts/vs02a-jwt-checkpoint
        run: go build -o "$RUNNER_TEMP/vs02a-jwt-proof" .
      - name: Offline operator approval, secret and cleanup guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_vs02a_checkpoint_operator.py
      - name: Existing public JWKS probe guards
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-verify-supabase-jwks.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit tooling and production dependencies
        run: |
          npm audit
          npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tooling compatibility and lint coverage
        run: npm run test:tooling
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps/api/go.mod
      - name: Install pinned Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Mocked UI browser contracts
        run: npm run test:e2e:mock
      - name: Real Go and React integration
        run: npm run test:e2e:real
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs01a-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/playwright-integration-report/
            docs/vs01a-integration/evidence/
          retention-days: 14

  local-docker-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install pinned Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build and start actual Guest preview
        run: docker compose -f compose.local.yaml up --build -d --wait --wait-timeout 120
      - name: Actual Docker proxy and browser regression
        working-directory: apps/web
        run: npm exec -- playwright test --config playwright.local.config.ts
      - name: Retain container diagnostics
        if: always()
        run: |
          mkdir -p docker-preview-evidence
          docker compose -f compose.local.yaml ps --format json > docker-preview-evidence/status.json
          docker compose -f compose.local.yaml logs --no-color > docker-preview-evidence/containers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-docker-preview-evidence
          path: |
            docker-preview-evidence/
            apps/web/test-results/local-preview/
            apps/web/test-results/local-preview-results.json
            apps/web/playwright-report/local-preview/
          retention-days: 14
      - name: Stop this CI runner's preview only
        if: always()
        run: docker compose -f compose.local.yaml down

  secret-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local secrets and obvious key material
        run: bash scripts/check-secrets.sh
